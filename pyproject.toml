[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "enterprise-crawler-framework"
dynamic = ["version"]

description = "Production-oriented infrastructure for reliable Python crawlers and data-collection bots."
readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Lord Jester" }
]

requires-python = ">=3.11"

keywords = [
    "crawler",
    "web-crawling",
    "data-collection",
    "data-ingestion",
    "developer-tools",
    "python",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31"
]


[project.urls]
Homepage = "https://github.com/canerenaltungul/enterprise-crawler-framework"
Repository = "https://github.com/canerenaltungul/enterprise-crawler-framework"
Issues = "https://github.com/canerenaltungul/enterprise-crawler-framework/issues"
Changelog = "https://github.com/canerenaltungul/enterprise-crawler-framework/blob/main/CHANGELOG.md"


[project.scripts]
enterprise-crawler = "enterprise_crawler.cli.main:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["enterprise_crawler*"]
exclude = [
    "tests*",
    "examples*",
    "templates*",
    "scripts*",
    "docs*",
]


[tool.setuptools.dynamic]
version = { attr = "enterprise_crawler.version.__version__" }