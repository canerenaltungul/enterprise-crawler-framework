[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]
name = "enterprise-crawler-test-entrypoint-plugin"
version = "0.1.0"
description = "Integration-test plugin for Enterprise Crawler Framework."
requires-python = ">=3.11"
dependencies = []


[project.entry-points."enterprise_crawler.plugins"]
fixture-entry = "enterprise_crawler_test_entrypoint_plugin:FixturePlugin"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]