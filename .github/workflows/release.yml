name: Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"


permissions:
  contents: read


jobs:
  tests:
    name: Release test gate

    uses: ./.github/workflows/tests.yml


  lint:
    name: Release lint gate

    uses: ./.github/workflows/lint.yml


  build:
    name: Build and verify distributions

    needs:
      - tests
      - lint

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Show runtime version
        run: |
          python - <<'PY'
          from enterprise_crawler.version import __version__

          print(f"Framework version: {__version__}")
          PY

      - name: Verify tag matches framework version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PACKAGE_VERSION="$(
            python - <<'PY'
          from enterprise_crawler.version import __version__
          print(__version__)
          PY
          )"

          echo "Tag version:     ${TAG_VERSION}"
          echo "Package version: ${PACKAGE_VERSION}"

          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag does not match enterprise_crawler.version.__version__."
            exit 1
          fi

      - name: Clean previous distributions
        run: |
          rm -rf build
          rm -rf dist
          rm -rf *.egg-info
          rm -rf enterprise_crawler_framework.egg-info

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          python -m twine check dist/*

      - name: Verify distribution files
        run: |
          python - <<'PY'
          from pathlib import Path


          dist = Path("dist")

          wheels = sorted(
              dist.glob("*.whl")
          )

          sdists = sorted(
              dist.glob("*.tar.gz")
          )

          if len(wheels) != 1:
              raise SystemExit(
                  "Expected exactly one wheel, "
                  f"found {len(wheels)}: {wheels}"
              )

          if len(sdists) != 1:
              raise SystemExit(
                  "Expected exactly one sdist, "
                  f"found {len(sdists)}: {sdists}"
              )

          print(
              f"Wheel: {wheels[0].name}"
          )

          print(
              f"SDist: {sdists[0].name}"
          )
          PY

      - name: Smoke test wheel in clean virtual environment
        shell: bash
        run: |
          WHEEL_PATH="$(realpath "$(ls dist/*.whl)")"

          python -m venv "${RUNNER_TEMP}/wheel-venv"

          "${RUNNER_TEMP}/wheel-venv/bin/python" \
            -m pip install --upgrade pip

          "${RUNNER_TEMP}/wheel-venv/bin/python" \
            -m pip install "${WHEEL_PATH}"

          mkdir -p "${RUNNER_TEMP}/wheel-smoke"

          cp \
            examples/basic_bot/hello_bot.py \
            "${RUNNER_TEMP}/wheel-smoke/hello_bot.py"

          cd "${RUNNER_TEMP}/wheel-smoke"

          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          from importlib.metadata import version

          import enterprise_crawler


          installed_version = version(
              "enterprise-crawler-framework"
          )

          runtime_version = (
              enterprise_crawler.__version__
          )

          print(
              "Installed metadata version: "
              f"{installed_version}"
          )

          print(
              "Runtime version:            "
              f"{runtime_version}"
          )

          print(
              "Module path:                "
              f"{enterprise_crawler.__file__}"
          )

          if installed_version != runtime_version:
              raise SystemExit(
                  "Installed metadata version does not "
                  "match runtime version."
              )

          from enterprise_crawler import (
              BaseBot,
              Crawler,
              ExecutionResult,
              ExecutionStatus,
          )

          print(
              "Top-level public API import: OK"
          )
          PY

          "${RUNNER_TEMP}/wheel-venv/bin/enterprise-crawler" \
            --version

          "${RUNNER_TEMP}/wheel-venv/bin/enterprise-crawler" \
            doctor

          "${RUNNER_TEMP}/wheel-venv/bin/python" \
            hello_bot.py

      - name: Smoke test source distribution in clean virtual environment
        shell: bash
        run: |
          SDIST_PATH="$(realpath "$(ls dist/*.tar.gz)")"

          python -m venv "${RUNNER_TEMP}/sdist-venv"

          "${RUNNER_TEMP}/sdist-venv/bin/python" \
            -m pip install --upgrade pip

          "${RUNNER_TEMP}/sdist-venv/bin/python" \
            -m pip install "${SDIST_PATH}"

          mkdir -p "${RUNNER_TEMP}/sdist-smoke"

          cp \
            examples/basic_bot/hello_bot.py \
            "${RUNNER_TEMP}/sdist-smoke/hello_bot.py"

          cd "${RUNNER_TEMP}/sdist-smoke"

          "${RUNNER_TEMP}/sdist-venv/bin/python" - <<'PY'
          from importlib.metadata import version

          import enterprise_crawler


          installed_version = version(
              "enterprise-crawler-framework"
          )

          runtime_version = (
              enterprise_crawler.__version__
          )

          print(
              "Installed metadata version: "
              f"{installed_version}"
          )

          print(
              "Runtime version:            "
              f"{runtime_version}"
          )

          print(
              "Module path:                "
              f"{enterprise_crawler.__file__}"
          )

          if installed_version != runtime_version:
              raise SystemExit(
                  "Installed metadata version does not "
                  "match runtime version."
              )

          from enterprise_crawler import (
              BaseBot,
              Crawler,
              ExecutionResult,
              ExecutionStatus,
          )

          print(
              "SDist public API import: OK"
          )
          PY

          "${RUNNER_TEMP}/sdist-venv/bin/enterprise-crawler" \
            --version

          "${RUNNER_TEMP}/sdist-venv/bin/enterprise-crawler" \
            doctor

          "${RUNNER_TEMP}/sdist-venv/bin/python" \
            hello_bot.py

      - name: Upload verified release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  github-release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Show release files
        run: |
          ls -lah dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; uploading verified assets."

            gh release upload \
              "${GITHUB_REF_NAME}" \
              dist/* \
              --clobber
          else
            gh release create \
              "${GITHUB_REF_NAME}" \
              dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi